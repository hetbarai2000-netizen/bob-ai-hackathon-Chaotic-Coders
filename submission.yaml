submission:
  title: "Clinical Trial Risk Monitor & Protocol Deviation Detector"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

 problem_statement: >
  A major clinical trial has 5,000+ patient visits across 200+ sites.
  Protocol deviations such as missed visits, incorrect dosing, and prohibited
  co-medications often remain undetected until regulatory audits. This can
  delay drug approval by 6–12 months and significantly increase costs.

  solution_summary: >
  TrialGuard AI compares patient records with clinical trial protocols to
  automatically detect and classify protocol deviations, assess site-level
  risk, and generate CAPA-ready reports with AI-powered recommendations for
  corrective actions.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "AI-powered protocol deviation detection"                               # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
    - "Major, minor, and administrative severity classification"
    - "Site-level clinical trial risk scoring"
    - "Real-time risk monitoring dashboard"                               # optional 4th
    - "CAPA-ready reports with recommended mitigations"                               # optional 5th

  tech_stack:
    languages: ["Python", "JavaScript","c++"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Bob"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["PostgreSQL"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["GitHub Actions", "Slack API"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >
  We are most proud of integrating AI-driven protocol deviation detection,
  real-time risk visualization, and an intuitive dashboard tailored for
  pharmaceutical clinical trial management.

  known_limitations: >
  The current version uses simulated clinical trial data and supports a
  limited number of protocol formats. Future versions will include direct
  EDC integrations and expanded AI capabilities.

