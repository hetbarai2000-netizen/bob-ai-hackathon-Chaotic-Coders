submission:
  title: "Clinical Trial Risk Monitor & Protocol Deviation Detector"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement:A major clinical trial has 5,000+ patient visits across 200+ sites. Protocol deviations — missed visits, wrong dosing, banned co-medications — go undetected until the FDA audit. A single rejected submission delays drug approval by 6–12 months and costs $50–100M. Risk managers need real-time visibility into which sites are highest risk before problems escalate. >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Replace this text with a concise description of the real-world problem
    your project addresses and who experiences it.

  solution_summary:TrialGuard AI compares patient records with clinical trial protocols to detect and classify deviations, assess site-level risk, and generate CAPA-ready reports with recommended actions. >                  # REQUIRED — 1-3 sentences. What did you build?
    Replace this text with a clear description of your solution
    and how it addresses the problem above.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "AI-powered protocol deviation detection"                               # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
    - "Major, minor, and administrative severity classification"
    - "Site-level clinical trial risk scoring"
    - "Real-time risk monitoring dashboard"                               # optional 4th
    - "CAPA-ready reports with recommended mitigations"                               # optional 5th

  tech_stack:
    languages: ["Python", "JavaScript","c++"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["IBM Bob"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["PostgreSQL"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["GitHub Actions", "Slack API"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    Replace with what aspect of the submission you consider strongest
    and want judges to pay special attention to.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Replace with any known limitations, incomplete features,
    or shortcuts taken due to time constraints.

